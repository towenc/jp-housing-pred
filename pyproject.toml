[project]
name = "jp-housing-pred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Towen Chan", email = "towen.chan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "marimo>=0.24.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
jp-housing-pred = "jp_housing_pred:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
