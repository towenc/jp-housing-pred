name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# A new push to the same PR cancels the in-flight review instead of queueing another.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first; this is a learning
            project, so point at problems rather than writing fixes. Name the
            file and line and explain what goes wrong; do not post suggested
            code patches.

            Focus on real problems: correctness bugs, tests that don't actually
            test anything, and things that will hurt at 10x the data. Mention
            when a standard library or idiom already solves something being
            hand-rolled. Don't pad with praise and don't invent nitpicks; if
            there is nothing worth raising, say so in one line.

            Use inline comments for line-specific issues, and one top-level
            PR comment (gh pr comment) for the overall summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
